# Delphi workspace Cargo configuration.
#
# NO `build.target-dir` PIN — cargo's default (`<workspace>/target`, already
# gitignored) is used, because it is the only value that works on every tree
# without per-machine setup.
#
# WHY THIS CHANGED (2026-08-15). This file pinned
#     target-dir = "/home/raven/delphi-target"
# to keep artifacts off WSL's slow /mnt/c 9p mount. That path exists on exactly
# one machine, so on every other tree the FIRST cargo command of a session died
# with `failed to create directory /home/raven: Permission denied (os error 13)`
# — an error naming neither this file nor the fix. A default that hard-fails
# everywhere but one box is worse than one that is merely slower on one box:
# the failure is guaranteed, cryptic, and arrives before any work can start.
#
# IF YOUR REPO IS ON A SLOW MOUNT (WSL under /mnt/c, a network share), opt IN:
#     export CARGO_TARGET_DIR="$HOME/delphi-target"
# The env var overrides this file and outranks anything writable here. Put it in
# your shell profile, so the setting lives with the environment that needs it
# rather than in the repo shared by environments that do not. CI sets its own.
