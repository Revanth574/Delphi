# cargo-deny configuration (leverage pass P4 CI gate). Sane defaults; the license
# allow-list is calibrated to the actual dependency tree (a local `cargo deny
# check` run confirms it before this lands — an unlisted-but-legitimate license
# would otherwise fail CI).

[advisories]
version = 2
# Fail on yanked crates; RustSec advisories are denied by default in v2.
yanked = "deny"

# Two transitive UNMAINTAINED advisories accepted with documented justification
# (leverage pass P4). NOT a blanket silence: only these exact IDs are waived; any
# other advisory — especially a vulnerability — still fails CI. Each was surfaced
# by a local `cargo deny check` before this landed; each carries a re-check trigger.
#
# Division of labour by advisory CLASS (verified, not assumed): cargo-deny v2
# gates the UNMAINTAINED + vulnerability + yanked classes only — it has NO
# `unsound` knob (`unsound = "..."` fails config deserialization), so it never
# raises the lru UNSOUND advisory RUSTSEC-2026-0002. That class is gated by the
# CI's `cargo audit --deny unsound` step, where lru is accepted by ID with a
# reachability justification. An lru ignore HERE would be decorative — cargo-deny
# does not raise it — so acceptance lives once, with the tool that actually gates
# the class. See .github/workflows/ci.yml (cargo audit step) and PROGRESS.md.
ignore = [
    { id = "RUSTSEC-2025-0057", reason = "fxhash 0.2.1 — unmaintained, not vulnerable. Transitive via scraper->selectors; no in-range upgrade. Re-check / drop on a scraper (or selectors) bump that retires fxhash." },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 — unmaintained, not vulnerable. Transitive via smithay->pixman; no in-range upgrade. Re-check / drop on a smithay bump that retires paste." },
]

[licenses]
version = 2
# Permissive licenses compatible with the project (CLAUDE.md §11: MIT/Apache/BSD).
# Calibrated against the workspace dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate are common in a large tree; warn, don't fail.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
