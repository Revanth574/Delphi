[package]
name = "die-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Three-tier inference manager for the Delphi Intelligence Engine"

[dependencies]
fortress = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
delphi-proto = { workspace = true }
llama-cpp-2 = { workspace = true }
zbus = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
serde_json = "1"
# SVC-1-R1-1: HMAC-SHA256 for the opaque cloud-egress ConfirmationToken.
# hmac 0.12 pairs with digest 0.10 / sha2 0.10 (the versions already in the
# workspace lockfile); hmac 0.13 would pull a conflicting digest 0.11.
sha2 = { workspace = true }
hmac = "0.12"
rand = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
