[package]
name = "fortress"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Delphi OS security subsystem: encryption, ZK proofs, TPM, federated sync"

[dependencies]
delphi-hardening = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
zbus = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

# ZKQP digit classification (FORT-R2-01): General_Category = Decimal_Number
# (Nd) is the authoritative "decimal digit, any script" — hand-enumerated
# ranges proved incomplete twice (full-width, then Arabic-Indic). Same crate
# and pattern as die-orchestrator's path sanitation (Task 3A.6).
unicode-general-category = "1"

[dev-dependencies]
tracing-subscriber = { workspace = true }
criterion = { workspace = true }
# ZKQP detector completeness property tests (tests/zkqp_completeness.rs): the
# Nd-digit / Unicode-separator completeness contract (FORT-R2-01) and the
# deliberate ASCII-only scope of the IP/date scanners, as properties. Leverage
# pass P4 (stable proptest, not nightly cargo-fuzz — the invariant is shape-driven).
proptest = { workspace = true }
