# Delphi runtime daemon — Increment 1a: the root-anchor keystone.
#
# Builds against the ratified docs/TRUST_MODEL.md as spec. 1a establishes the
# root-owned approval-socket directory and the privilege-drop seam ONLY — no
# private channel, PAM, token, sandbox, or execute (those are 1b–1d).
[package]
name = "delphi-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The lib carries the testable logic (privilege-drop ordering, anchor establishment).
[lib]
name = "delphi_runtime"
path = "src/lib.rs"

# The bin is the thin root entrypoint systemd starts (delphi-runtimed@.service).
[[bin]]
name = "delphi-runtimed"
path = "src/bin/delphi-runtimed.rs"

# B1 minimal sides — daemon-forked children for the integrated end-to-end. NOT the
# real React-WRY shell / Brain (B2); the thinnest things that drive the real wire.
[[bin]]
name = "delphi-minimal-shell"
path = "src/bin/delphi-minimal-shell.rs"

[[bin]]
name = "delphi-minimal-ai"
path = "src/bin/delphi-minimal-ai.rs"

[dependencies]
# Syscall layer (§13.7: reuse the workspace's existing nix 0.30; add the feature
# gates 1a needs — `user` for set{groups,gid,uid}/geteuid, `fs` for chown/unlink,
# `process` for fork/execve used by the child-drop path).
# D0 adds "poll": the readiness wait watches the channel and the pidfd together, so a shell
# that dies without signalling is reported at once instead of after the full timeout. A
# feature of an already-vetted dependency — no new crate, no change to the audit surface.
nix = { version = "0.30", features = ["user", "fs", "process", "socket", "signal", "poll"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Capability token (1c): HMAC-SHA256, mirroring the proven die-inference token
# pattern but binding the action digest and minted by the root daemon.
hmac = "0.12"
sha2 = { workspace = true }
# Canonical action digest (1d): the leverage-pass CanonicalHasher (declared-count
# guard + the no-`..` exhaustive-destructure discipline) is the preview=approval=
# sandbox=audit binding.
delphi-hardening = { workspace = true }
# PAM (1c): pam-client2 exposes a custom ConversationHandler trait so the consent
# conversation can be routed over the 1b private channel (recon #1 — verified the
# crate supports a non-tty custom conversation).
pam-client2 = "0.5"
# B1: the AI↔daemon general-socket wire is protobuf (the project's IPC law; B2's
# real Brain reuses the wire unchanged). prost-generated message types.
prost = { workspace = true }

[build-dependencies]
# B1: compile runtime/proto/runtime_wire.proto into Rust types.
prost-build = "0.13"

[features]
# B1 test-only: a logind-verdict override the binary-flow test uses (WSL2 sessions
# are ephemeral/seatless, so a real `sd_pid_get_session` on the forked shell yields
# no active session). COMPILE-TIME EXCLUDED from production builds — the seam does
# not exist in the shipped daemon; the privileged lane builds the test with it.
insecure-test-seams = []
