[package]
name = "delphi-services"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "D-Bus service layer for Delphi OS — bridges shell UI to Rust backends"

[dependencies]
die-inference = { workspace = true }
die-orchestrator = { path = "../die/orchestrator" }
semantic-fs = { workspace = true }
fortress = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
anyhow = { workspace = true }
zbus = { workspace = true }
chrono = { workspace = true }
# SVC-2 Stage 1b: the caller resolver consumes the org.freedesktop.DBus
# NameOwnerChanged signal stream to invalidate its credential cache; StreamExt
# provides `.next()` on the zbus signal stream (zbus re-exports only
# futures_core/ordered_stream, not StreamExt). Already in the dep tree
# transitively via tokio/zbus.
futures-util = { workspace = true }

# FIX 15 (Codex re-review): `open_dir_no_follow` needs Linux libc
# constants (O_DIRECTORY | O_NOFOLLOW | O_CLOEXEC) to register
# allowlist roots as held directory handles rather than
# re-resolvable path strings. libc is already in the workspace via
# tokio + die-orchestrator transitively, so this is a
# declaration-of-intent rather than a build-cost change.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tracing-subscriber = { workspace = true }
# Allowlist tests use TempDir to construct isolated allowed roots
# (Codex review FIX 1 + FIX 4, Task 3A.5).
tempfile = { workspace = true }
